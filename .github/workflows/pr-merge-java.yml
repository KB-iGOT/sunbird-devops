# org-infra/.github/workflows/sonarqube-pr.yml
name: Reusable SonarQube PR Workflow

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
      build_command:
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK and Maven
        uses:  actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          maven-version: 3.8.8

      - name: Run Build
        run: ${{ inputs.build_command }}

      - name: Run SonarQube Scanner
        uses: sonarsource/sonarqube-scan-action@v1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
