---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: {{ default .Values.namespace .Release.Namespace  }}
  labels:
    k8s-app: fluent-bit-logging
    version: v1
    kubernetes.io/cluster-service: "true"
    {{- include "fluent-bit.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      k8s-app: fluent-bit-logging
      version: v1
      kubernetes.io/cluster-service: "true"
      {{- include "fluent-bit.labels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        k8s-app: fluent-bit-logging
        version: v1
        kubernetes.io/cluster-service: "true"
{{- include "fluent-bit.labels" . | nindent 8 }}
      annotations:
        fluent-bitRolloutID: {{ randAlphaNum 5 | quote }} # Restart fluent-bit after every deployment
        fluentbit.io/exclude: "true"
    spec:
{{- if .Values.imagepullsecrets }}
      imagePullSecrets:
      - name: {{ .Values.imagepullsecrets }}
{{- end }}
      containers:
      - name: fluent-bit
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 2020
          name: http-metrics
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu | default "200m" | quote }}
            memory: {{ .Values.resources.requests.memory | default "256Mi" | quote }}
          limits:
            cpu: {{ .Values.resources.limits.cpu | default "1" | quote }}
            memory: {{ .Values.resources.limits.memory | default "512Mi" | quote }}
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 2020
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 2020
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
        env:
        - name: FLUENT_ELASTICSEARCH_HOST
          value: "{{ .Values.es_host }}"
        - name: FLUENT_ELASTICSEARCH_PORT
          value: "{{ .Values.es_port }}"
        volumeMounts:
        - mountPath: /mnt/log
          name: datapath
        - name: varlog
          mountPath: /var/log
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: fluent-bit-config
          mountPath: /fluent-bit/etc/
      terminationGracePeriodSeconds: 60
      volumes:
      - name: datapath
        hostPath:
          path: /mnt/stateful_partition/log
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: fluent-bit-config
        configMap:
          name: fluent-bit-config
      serviceAccountName: fluent-bit
      tolerations:
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      - operator: "Exists"
        effect: "NoExecute"
      - operator: "Exists"
        effect: "NoSchedule"
