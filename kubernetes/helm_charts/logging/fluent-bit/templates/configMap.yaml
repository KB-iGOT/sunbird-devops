---
apiVersion: v1
data:
  filter-kubernetes.conf: |
    [FILTER]
        # Drop noisy records before kubernetes enrichment.
        # Field is 'log' (raw CRI text) at this stage — 'message' does not exist yet.
        # Dropping early avoids API lookups + Merge_Log for discarded records.
        Name grep
        Match kube.*
        Exclude log (?i)GET (?:\/service)?\/health
        Exclude log (?i)"level"\s*:\s*"debug"
        Exclude log (?i)"level"\s*:\s*"info"

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        # Merge application log to kubernetes structure
        Merge_Log           On
        # Disabling merge key as all the fileds will be in the root
        # Else all merged content will be under
        # log_processed:
        #    {
        #    }
        # Merge_Log_Key       log_processed
        #
        # Adding custom parsor not to do any json parse
        Merge_Parser        catchall
        # Don't need merged logs
        # More over, we're using custom parser, which catch all and tag it as log
        Keep_Log            Off
        # Annotate pod to select the parser
        # annotaions:
        #   fluentbit.io/parsers: nginx2
        K8S-Logging.Parser  On
        # Disable fluent-bit from parsing logs
        # annotaions:
        #   fluentbit.io/exclude: true
        K8S-Logging.Exclude On

    [FILTER]
        Name          nest
        Match         kube.*
        Operation     lift
        Nested_under  kubernetes
        Add_prefix    kubernetes_

    [FILTER]
        Name          nest
        Match         kube.*
        Operation     lift
        Nested_under  kubernetes_labels
        Add_prefix    kubernetes_labels_

    [FILTER]
        # Lift annotations to flat fields first so modify can target them by name.
        Name          nest
        Match         kube.*
        Operation     lift
        Nested_under  kubernetes_annotations
        Add_prefix    kubernetes_annotations_

    # ===========================================================================
    # NOISY APP FILTERING
    # ---------------------------------------------------------------------------
    # Some services produce excessive INFO/DEBUG logs that contribute the
    # majority of daily index volume with no operational value.
    #
    # Strategy:
    #   1. rewrite_tag isolates the service into a separate tag (course.noisy)
    #   2. grep drops INFO / DEBUG / TRACE on that tag only
    #   3. WARN and ERROR pass through unchanged to Elasticsearch
    #
    # To add more services, duplicate the rewrite_tag Rule and grep block.
    # ===========================================================================

    [FILTER]
        # Route cb-ext-course-service logs to a separate tag so we can
        # drop INFO/DEBUG/TRACE without affecting other services.
        # course.noisy does not match kube.* — avoids re-processing loop.
        Name                    rewrite_tag
        Match                   kube.*
        # Top log producers by volume (2026-04-03):
        #   1. cb-ext-course-service                        ~3.6B docs/day (48%)
        #   2. program-activity-aggregate-updater-taskmanager ~742M docs/day (10%)
        Rule                    $kubernetes_container_name ^(cb-ext-course-service|program-activity-aggregate-updater-taskmanager)$ course.noisy false
        Emitter_Storage.type    filesystem
        Emitter_Mem_Buf_Limit   50M

    [FILTER]
        # Drop INFO/DEBUG/TRACE for cb-ext-course-service.
        # Record re-enters here after rewrite_tag — all kube fields intact.
        Name    grep
        Match   course.noisy
        Exclude message (?:INFO|DEBUG|TRACE)

    [FILTER]
        # Strip noisy/large annotations that add no value to log analysis.
        # Fields exist as flat kubernetes_annotations_* after the lift above.
        Name    modify
        Match   kube.*
        # Full serialised object YAML — can be 10-50 KB per record
        Remove  kubernetes_annotations_kubectl.kubernetes.io/last-applied-configuration
        # Helm config/secret checksums — only useful for Helm diffing, not logs
        Remove  kubernetes_annotations_checksum/config
        Remove  kubernetes_annotations_checksum/secret
        # Deployment revision counter — already visible in kubernetes_labels
        Remove  kubernetes_annotations_deployment.kubernetes.io/revision
        # Rollout restart timestamp — not useful per log record
        Remove  kubernetes_annotations_kubectl.kubernetes.io/restartedAt
  fluent-bit.conf: |
    [SERVICE]
        Flush         10
        Log_Level     WARNING
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        storage.path              /mnt/log/flb-storage/
        storage.sync              normal
        storage.checksum          off
        storage.backlog.mem_limit 256M
        # Allow 128 warm chunks in memory (was 50 — caused 'no available chunk')
        storage.max_chunks_up     128
        # Expose chunk metrics to Prometheus
        storage.metrics           on
        # Auto-delete corrupt chunks that block the pipeline
        storage.delete_irrecoverable_chunks on

    @INCLUDE input-kubernetes.conf
    @INCLUDE filter-kubernetes.conf
    @INCLUDE output-elasticsearch.conf
  input-kubernetes.conf: |
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        # Exclude fluent-bit own logs to avoid recursion
        # Exclude kube-system namespace — path format: <pod>_<namespace>_<container>-<id>.log
        Exclude_Path      /var/log/containers/fluent-bit*,/var/log/containers/*_kube-system_*
        Parser            cri
        DB                /mnt/log/flb_kube.db
        # Mem_Buf_Limit has no effect with storage.type filesystem
        # Backpressure controlled by storage.max_chunks_up instead
        Buffer_Chunk_Size 512k
        Buffer_Max_Size   2M
        Skip_Long_Lines   On
        # Reduce scan frequency (was 1s — unnecessary CPU overhead)
        Refresh_Interval  5
        storage.type      filesystem
        # Ignore older logs of 30m
        Ignore_Older      30m
  output-elasticsearch.conf: |
    [OUTPUT]
        Name            es
        Match           *
        Host            ${FLUENT_ELASTICSEARCH_HOST}
        Port            ${FLUENT_ELASTICSEARCH_PORT}
        Logstash_Format On
        Replace_Dots    On
        Type            _doc
        # Parallel flush workers (was 1 — the main bottleneck)
        Workers         4
        # Compress bulk payloads — ~70% bandwidth reduction
        Compress        gzip
        # Prevent duplicate records on retry
        Generate_ID     On
        # Restore v1.6 write behavior for ES 7.x compatibility
        Write_Operation index
        # Bounded retries — ~3-4 hours of exponential backoff then drop
        # Avoids infinite backlog accumulation when ES is down
        Retry_Limit     15
        # Log ES errors for debugging
        Trace_Error     On
        # ES bulk response buffer (default 512k too small for large batches)
        Buffer_Size     2M
        # Networking
        net.connect_timeout         10
        net.keepalive               on
        net.keepalive_idle_timeout  100
        net.keepalive_max_recycle   2000
        # Limit filesystem buffer per output (was 20G — risked filling node disk)
        storage.total_limit_size    5G
  parsers.conf: |
    [PARSER]
        Name   apache
        Format regex
        Regex  ^(?<host>[^ ]*) [^ ]* (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^\"]*?)(?: +\S*)?)?" (?<code>[^ ]*) (?<size>[^ ]*)(?: "(?<referer>[^\"]*)" "(?<agent>[^\"]*)")?$
        Time_Key time
        Time_Format %d/%b/%Y:%H:%M:%S %z

    [PARSER]
        Name   apache2
        Format regex
        Regex  ^(?<host>[^ ]*) [^ ]* (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^ ]*) +\S*)?" (?<code>[^ ]*) (?<size>[^ ]*)(?: "(?<referer>[^\"]*)" "(?<agent>[^\"]*)")?$
        Time_Key time
        Time_Format %d/%b/%Y:%H:%M:%S %z

    [PARSER]
        Name   apache_error
        Format regex
        Regex  ^\[[^ ]* (?<time>[^\]]*)\] \[(?<level>[^\]]*)\](?: \[pid (?<pid>[^\]]*)\])?( \[client (?<client>[^\]]*)\])? (?<message>.*)$

    [PARSER]
        Name   nginx
        Format regex
        Regex ^(?<remote>[^ ]*) (?<host>[^ ]*) (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^\"]*?)(?: +\S*)?)?" (?<code>[^ ]*) (?<size>[^ ]*)(?: "(?<referer>[^\"]*)" "(?<agent>[^\"]*)")?$
        Time_Key time
        Time_Format %d/%b/%Y:%H:%M:%S %z

    [PARSER]
        Name   json
        Format json
        Time_Key time
        Time_Format %d/%b/%Y:%H:%M:%S %z

    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

    [PARSER]
        Name        nginx2
        Format      regex
        # https://rubular.com/r/IWnYbkLpdRI8Jh
        Regex       ^(?<n_cip>[^ ]*) (?<n_host>[^ ]*) (?<n_uid>[^ ]*) \[(?<n_time>[^\]]*)\] "(?<n_verb>\S+)(?: +(?<n_path>[^\"]*?)(?: +\S*)?)?" (?<n_rscode>[^ ]*) (?<n_rqsize>[^ ]*) (?<n_rssize>[^ ]*) (?<n_rqtime>[^ ]+) (?<n_rstime>[^ ]+) (?<n_pipe>\.*) (?:"(?<n_referer>[^\"]*)" "(?<n_agent>[^\"]*)") "(?<n_tid>[^\"]*)" "(?<n_did>[^\"]*)" "(?<n_cid>[^\"]*)" "(?<n_aid>[^\"]*)" "(?<n_aver>[^\"]*)" "(?<n_sid>[^\"]*)"\s*(?<n_raw>.*)$
        Time_Key    time
        Types       n_rstime:float n_rqtime:float n_rssize:integer n_rqsize:integer n_rscode:integer
        Time_Format %d/%b/%Y:%H:%M:%S %z

    [PARSER]
        Name        kong
        Format      regex
        # https://rubular.com/r/OkDY3qc0KFGXeX
        Regex       ^(?<k_cip>[^ ]*) (?<k_host>[^ ]*) (?<k_uid>[^ ]*) \[(?<k_time>[^\]]*)\] "(?<k_verb>\S+)(?: +(?<k_path>[^\"]*?)(?: +\S*)?)?" (?<k_rscode>[^ ]*) (?<k_rqsize>[^ ]*) (?:"(?<k_referer>[^\"]*)" "(?<k_agent>[^\"]*)")
        Time_Key    time
        Types       k_rscode:integer k_rqsize:integer
        Time_Format %d/%b/%Y:%H:%M:%S %z

    [PARSER]
        Name        syslog
        Format      regex
        Regex       ^\<(?<pri>[0-9]+)\>(?<time>[^ ]* {1,2}[^ ]* [^ ]*) (?<host>[^ ]*) (?<ident>[a-zA-Z0-9_\/\.\-]*)(?:\[(?<pid>[0-9]+)\])?(?:[^\:]*\:)? *(?<message>.*)$
        Time_Key    time
        Time_Format %b %d %H:%M:%S

    [PARSER]
        Name    catchall
        Format  regex
        Regex   ^(?<message>.*)$
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: {{ default .Values.namespace .Release.Namespace  }}
  labels:
{{- include "fluent-bit.labels" . | nindent 4 }}
