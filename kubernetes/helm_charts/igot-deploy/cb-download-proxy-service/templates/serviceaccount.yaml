{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cb-download-proxy-sa
  namespace: {{ default .Values.namespace .Release.Namespace  }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.cb_download_proxy_service_account }}
  labels:
{{ include "cb-download-proxy.labels" . | nindent 4 }}
{{- end -}}