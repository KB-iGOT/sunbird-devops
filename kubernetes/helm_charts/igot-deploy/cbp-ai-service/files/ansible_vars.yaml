---
# vars file for deploy-vega-service
# For script
release_name: "{{ network_alias_cbp_ai_service }}"
user_friendly_name: cbp_ai service
template_env_file_name: "cbp_ai.j2"
compose_file_name: "{{ service_cbp_ai_service }}.yml"
env_file_name: "{{ service_cbp_ai_service }}.env"
helm_env_file_location: "../helm_charts/igot-deploy/templates/"
helm_env_file_name: "{{ helm_env_file_location }}/{{ service_cbp_ai_service }}.env"


env_file_deployment_location: "{{ env_files_dir }}/{{ env_file_name }}"
compose_file_deployment_location: "{{ compose_files_dir }}/{{ compose_file_name }}"

# For service
application_port: "{{ service_cbp_ai_port }}"
image_name: "{{ image_cbp_ai_service }}"
tag: "{{ tags_cbp_ai_service }}"
host_port: "{{ application_port }}"
docker_port: "{{ application_port }}"
replicas: "{{ service_replicas_cbp_ai_service }}"
reserved_memory: "{{ service_mem_reserved_cbp_ai_service }}"
limited_memory: "{{ service_mem_limit_cbp_ai_service }}"
health_check_endpoint: http://127.0.0.1:{{ docker_port }}/healthcheck
network_alias_name: "{{ network_alias_cbp_ai_service }}"
docker_service_stack_name: ui
docker_service_name: "{{ service_cbp_ai_service }}"
force_reload: "{{ force_reload_cbp_ai_service }}"

