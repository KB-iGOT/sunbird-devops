---
{{- $keys := .Files.Glob "keys/*" }}
{{ if $keys }}
apiVersion: v1
kind: Secret
metadata:
  name: cb-ext-access-keys
type: Opaque
data:
{{ (.Files.Glob "keys/*").AsSecrets | indent 2 }}
{{ end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cbdownloadprivkeypem
  namespace: {{ .Values.namespace }}
data:
  gcp_gemini_credentials.json: |
{{ .Values.cbdownloadprivkeypem | indent 4 }}
