---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
     rollingUpdate:
        maxSurge: {{ .Values.strategy.maxsurge }}
        maxUnavailable: {{ .Values.strategy.maxunavailable }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
{{- if .Values.imagepullsecrets }}
      imagePullSecrets:
      - name: {{ .Values.imagepullsecrets }}
{{- end }}
      volumes:
        - name: gcpdeterministicchatbotcredentialsjson
          configMap:
            name: gcpdeterministicchatbotcredentialsjson
        - name: gcpdeterministicchatbotstoragecredentialsjson
          configMap:
            name: gcpdeterministicchatbotstoragecredentialsjson
        - name: allocation-file
          configMap:
            name: deterministic-chatbot-allocation

      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.dockerhub }}/{{ .Values.repository }}:{{ .Values.image_tag }}"
        imagePullPolicy: Always
        env:
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /app/gcp/gcpdeterministicchatbotcredentials.json
        envFrom:
        - configMapRef:
            name: {{ .Chart.Name }}-config
        resources:
{{ toYaml .Values.resources | indent 10 }}
        volumeMounts:
        - name: gcpdeterministicchatbotcredentialsjson
          mountPath: /app/gcp/gcpdeterministicchatbotcredentials.json
          subPath: gcpdeterministicchatbotcredentials.json
        - name: gcpdeterministicchatbotstoragecredentialsjson
          mountPath: /app/gcp/gcp_storage_credentials.json
          subPath: gcp_storage_credentials.json
        - name: allocation-file
          mountPath: /app/data/{{ .Values.allocationfilename }}
          subPath: {{ .Values.allocationfilename }}
        ports:
        - containerPort: {{ .Values.network.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  ports:
  - name: http-{{ .Chart.Name }}
    protocol: TCP
    port: {{ .Values.network.port }}
    targetPort: {{ .Values.network.targetport }}
  selector:
    app: {{ .Chart.Name }}
