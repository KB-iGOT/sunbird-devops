---
# vars file for deploy-multitenant-staticweb
# For script
release_name: "{{ network_alias_multitenant_staticweb_service }}"
user_friendly_name: UI Static service
template_compose_file_name: multitenant-staticweb.j2
template_env_file_name: "../../shared_files/templates/ui-shared-env.j2"
compose_file_name: "{{ service_multitenant_staticweb_service }}.yml"
env_file_name: "{{ service_multitenant_staticweb_service }}.env"
env_file_deployment_location: "{{ env_files_dir }}/{{ env_file_name }}"
helm_env_file_location: "../helm_charts/igot-deploy/templates/"
helm_env_file_name: "{{ helm_env_file_location }}/{{ service_multitenant_staticweb_service }}.env"
#chart_path: "../kubernetes-deploy/multitenant-staticweb"
compose_file_deployment_location: "{{ compose_files_dir }}/{{ compose_file_name }}"

# For service
application_port: "{{ service_multitenant_staticweb_port }}"
image_name: "{{ image_multitenant_staticweb }}"
tag: "{{ tags_multitenant_staticweb }}"
host_port: "{{ application_port }}"
docker_port: "{{ application_port }}"
replicas: "{{ service_replicas_multitenant_staticweb_service }}"
reserved_memory: "{{ service_mem_reserved_multitenant_staticweb_service }}"
limited_memory: "{{ service_mem_limit_multitenant_staticweb_service }}"
health_check_endpoint: http://127.0.0.1:{{ docker_port }}/healthcheck
network_alias_name: "{{ network_alias_multitenant_staticweb_service }}"
docker_service_stack_name: ui
docker_service_name: "{{ service_multitenant_staticweb_service }}"
force_reload: "{{ force_reload_multitenant_staticweb_service }}"

sprint_version: 4.8.14
