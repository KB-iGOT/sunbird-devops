---
# vars file for deploy-lex-core-service

# For script
release_name: "{{ network_alias_custom_field_service }}"
template_compose_file_name: custom-field-service-service.j2
template_env_file_name: custom-field-service-service-env.j2
compose_file_name: "{{ service_custom_field_service }}.yml"
env_file_name: "{{ service_custom_field_service }}.env"
helm_env_file_location: "../helm_charts/igot-deploy/templates/"
helm_env_file_name: "{{ helm_env_file_location }}/{{ service_custom_field_service }}.env"
#chart_path: "../kubernetes-deploy/custom-field-service-service"

env_file_deployment_location: "{{ env_files_dir }}/{{ env_file_name }}"
compose_file_deployment_location: "{{ compose_files_dir }}/{{ compose_file_name }}"
user_friendly_name: content validation service

# For service
application_port: "{{ service_custom_field_service_port }}"
image_name: "{{ image_custom_field_service }}"
tag: "{{ tags_custom_field_service }}"
host_port: "{{ application_port }}"
docker_port: "{{ application_port }}"
replicas: "{{ service_replicas_custom_field_service }}"
reserved_memory: "{{ service_mem_reserved_custom_field_service }}"
limited_memory: "{{ service_mem_limit_custom_field_service }}"
#limited_memory: 2048M
health_check_endpoint: http://127.0.0.1:{{ docker_port }}/contentValidation/actuator/health
network_alias_name: "{{ network_alias_custom_field_service }}"
docker_service_stack_name: lms
docker_service_name: "{{ service_custom_field_service }}"
force_reload: "{{ force_reload_custom_field_service }}"

# For application
server_connection_timeout: 5000
tomcat_max_threads: 400
tomcat_min_spare_threads: 20
servlet_multipart_max_file_size: 100Mb
servlet_multipart_max_request_size: 100Mb
