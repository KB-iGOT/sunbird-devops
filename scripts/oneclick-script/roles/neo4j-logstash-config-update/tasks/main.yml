- name: Copy the template neo4j.conf file 
  become: yes
  become_user: "{{learner_user}}"
  template: src=neo4j.conf.j2 dest={{ neo4j_home }}/conf/neo4j.conf group={{learner_user}} owner={{learner_user}} mode=755

- name: Stop logstash process
  become: yes
  systemd: name=logstash state=stopped
  ignore_errors: yes

- name: Copy logstash configuration files for platform
  become: yes
  become_user: "{{learner_user}}"
  template: src=logstash-lp.j2  dest={{learner_user_home}}/logstash-{{logstash_version}}/logstash-lp.conf

- name: Start logstash process
  become: yes
  systemd: name=logstash state=started

- name: Check if neo4j is running
  become_user: "{{ learner_user }}"
  shell: ps -ef | grep "{{ neo4j_home }}"  | grep -v grep | wc -l
  register: neo4j_process

- name: Start neo4j
  become: yes
  become_user: "{{ learner_user }}"
  shell:  bin/neo4j start
  args:
    chdir: "{{ neo4j_home }}"
  when: "neo4j_process.stdout == '0'"