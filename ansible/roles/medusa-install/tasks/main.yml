- name: Install python3-pip and python3-venv
  apt:
    name:
      - python3-pip
      - python3-venv
    state: present
    update_cache: yes

- name: Create Medusa virtualenv and install cassandra-medusa[gcs]
  pip:
    name: cassandra-medusa[gcs]
    virtualenv: "{{ medusa_venv_path }}"
    virtualenv_command: python3 -m venv
    state: present

- name: Create Medusa config directory
  file:
    path: "{{ medusa_config_dir }}"
    state: directory
    mode: "0750"

- name: Deploy medusa.ini configuration
  template:
    src: medusa.ini.j2
    dest: "{{ medusa_config_file }}"
    mode: "0640"

- name: Deploy GCS service account credentials
  copy:
    content: "{{ gcp_backups_service_account }}"
    dest: "{{ medusa_credentials_file }}"
    mode: "0600"
