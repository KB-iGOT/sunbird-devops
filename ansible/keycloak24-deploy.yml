---
- name: Deploy Keycloak 24 to Kubernetes
  hosts: "{{ host }}"
  become: yes
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
    kubeconfig: "/var/lib/jenkins/secrets/k8s.yaml"
  vars_files:
    - "{{ inventory_dir }}/secrets.yml"

  tasks:

    - name: Set full GCR image path
      tags: deploy
      set_fact:
        kc24_image_full: "{{ dockerhub }}/keycloak24:{{ kc24_image_tag }}"

    - name: Apply KC24 Secret
      tags: deploy
      shell: |
        kubectl --kubeconfig={{ kubeconfig }} apply -f - <<EOF
        apiVersion: v1
        kind: Secret
        metadata:
          name: keycloak24-secret
          namespace: {{ kc24_namespace }}
        type: Opaque
        stringData:
          KC_DB_PASSWORD: "{{ kc24_db_password }}"
          KC_BOOTSTRAP_ADMIN_USERNAME: "{{ kc24_admin_user }}"
          KC_BOOTSTRAP_ADMIN_PASSWORD: "{{ kc24_admin_password }}"
        EOF

    - name: Apply KC24 ConfigMap
      tags: deploy
      shell: |
        kubectl --kubeconfig={{ kubeconfig }} apply -f - <<EOF
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: keycloak24-config
          namespace: {{ kc24_namespace }}
        data:
          KC_DB: "postgres"
          KC_DB_URL: "{{ kc24_db_url }}"
          KC_DB_USERNAME: "{{ kc24_db_username }}"
          KC_HOSTNAME: "{{ kc24_hostname }}"
          KC_HOSTNAME_ADMIN: "localhost"
          KC_PROXY: "edge"
          KC_HOSTNAME_STRICT: "false"
          KC_HOSTNAME_STRICT_HTTPS: "false"
          KC_HTTP_ENABLED: "true"
        EOF

    - name: Apply KC24 Deployment
      tags: deploy
      shell: |
        kubectl --kubeconfig={{ kubeconfig }} apply -f - <<EOF
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: keycloak24
          namespace: {{ kc24_namespace }}
          labels:
            app: keycloak24
        spec:
          replicas: {{ kc24_replicas | default(1) | int }}
          selector:
            matchLabels:
              app: keycloak24
          template:
            metadata:
              labels:
                app: keycloak24
            spec:
              imagePullSecrets:
              - name: {{ imagepullsecrets }}
              containers:
              - name: keycloak24
                image: "{{ kc24_image_full }}"
                args: ["start"]
                envFrom:
                - configMapRef:
                    name: keycloak24-config
                - secretRef:
                    name: keycloak24-secret
                ports:
                - containerPort: 8080
        EOF

    - name: Apply KC24 Service
      tags: deploy
      shell: |
        kubectl --kubeconfig={{ kubeconfig }} apply -f - <<EOF
        apiVersion: v1
        kind: Service
        metadata:
          name: keycloak24
          namespace: {{ kc24_namespace }}
        spec:
          selector:
            app: keycloak24
          ports:
          - name: http
            port: 8080
            targetPort: 8080
        EOF

    - name: Wait for KC24 rollout
      tags: deploy
      shell: |
        kubectl --kubeconfig={{ kubeconfig }} rollout status deployment/keycloak24 \
          -n {{ kc24_namespace }} --timeout=180s
      ignore_errors: true

    - name: Check KC24 pod status
      tags: deploy
      shell: |
        kubectl --kubeconfig={{ kubeconfig }} get pods \
          -n {{ kc24_namespace }} -l app=keycloak24
      register: pod_status

    - name: Print KC24 pod status
      tags: deploy
      debug:
        var: pod_status.stdout_lines
